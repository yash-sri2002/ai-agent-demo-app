name: Automation Impact Analysis

# Fires when a PR is closed - the `if:` below narrows that to "closed by
# being merged" specifically, since a PR can also be closed without
# merging (nothing to analyze in that case).
on:
  pull_request:
    types: [closed]

# The built-in GITHUB_TOKEN isn't used for anything here - both the
# analysis calls and the PR comment use AGENT_GITHUB_TOKEN (a PAT with
# access to the private automation-impact-agent and Automation repos,
# which the built-in token can never have since it's scoped to this repo
# only). Kept minimal anyway, for the one checkout step that does use it.
permissions:
  contents: read

jobs:
  analyze:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation-impact-agent
        uses: actions/checkout@v4
        with:
          repository: yash-sri2002/automation-impact-agent
          ref: main
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          path: agent

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install agent dependencies
        working-directory: agent
        run: npm ci

      - name: Install Claude Code CLI (headless mode)
        run: npm install -g @anthropic-ai/claude-code

      - name: Run impact analysis and open a draft PR with the fix
        working-directory: agent
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          DEV_REPO_OWNER: yash-sri2002
          DEV_REPO_NAME: ai-agent-demo-app
          AUTOMATION_REPO_OWNER: yash-sri2002
          AUTOMATION_REPO_NAME: ai-agent-demo-automation
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npx tsx scripts/analyze-pr.ts ${{ github.event.pull_request.number }} --create-draft-pr --output ../report.md

      - name: Post report as a PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const report = fs.readFileSync("report.md", "utf-8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: report,
            });
